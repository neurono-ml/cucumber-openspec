name: Docs — Release

on:
  release:
    types: [published]

concurrency:
  group: docs-release-${{ github.sha }}
  cancel-in-progress: true

env:
  MDBOOK_VERSION: 0.5.2

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install mdbook
        run: |
          wget -q "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar xzf "mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          chmod +x mdbook
          sudo mv mdbook /usr/local/bin/

      - name: Check file parity across languages
        run: bash book/scripts/check-parity.sh

      - name: Build all languages
        run: bash book/scripts/build-all.sh

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./book/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
